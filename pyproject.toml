[project]
name = "mood-engine"
version = "0.1.0"
description = "Base24 theme engine for macOS: app theming, wallpaper and live hooks"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pillow>=10"]

[project.scripts]
mood-engine = "mood_engine.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
